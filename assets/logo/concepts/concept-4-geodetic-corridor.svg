<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Concept 4: Geodetic Survey Triangulation & Horizon Road Corridor -->
  <!-- Survey Benchmark Delta / Tripod Outer Frame -->
  <polygon points="50,14 88,82 12,82" 
           stroke="#0F172A" stroke-width="7" stroke-linejoin="round"/>
           
  <!-- Horizon Vanishing Road Corridor -->
  <polygon points="50,42 70,82 30,82" 
           fill="#2563EB"/>
           
  <!-- Dynamic Road Centerline Marking (Vanishing Perspective) -->
  <line x1="50" y1="46" x2="50" y2="54" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="50" y1="60" x2="50" y2="70" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <line x1="50" y1="76" x2="50" y2="82" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
  
  <!-- Apex Geodetic Control Station Node (BM-01) -->
  <circle cx="50" cy="14" r="5" fill="#2563EB"/>
  <circle cx="50" cy="14" r="2" fill="#FFFFFF"/>
</svg>
