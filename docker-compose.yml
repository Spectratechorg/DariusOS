version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: dariusos_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-darius}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-darius_secret}
      POSTGRES_DB: ${POSTGRES_DB:-dariusos_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-darius} -d ${POSTGRES_DB:-dariusos_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: dariusos_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: dariusos_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-darius}:${POSTGRES_PASSWORD:-darius_secret}@db:5432/${POSTGRES_DB:-dariusos_db}
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/app/storage
      - ./config:/app/config

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: dariusos_worker
    restart: unless-stopped
    command: ["python", "-m", "app.worker.runner"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-darius}:${POSTGRES_PASSWORD:-darius_secret}@db:5432/${POSTGRES_DB:-dariusos_db}
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./storage:/app/storage
      - ./config:/app/config

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dariusos_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
